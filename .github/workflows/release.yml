name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pytest>=8,<10"

      - name: Run tests
        run: python -m pytest -q

      - name: Build source archive and checksum
        shell: bash
        run: |
          set -euo pipefail
          repo_name="${GITHUB_REPOSITORY#*/}"
          tag="${GITHUB_REF_NAME}"
          mkdir -p dist
          git archive \
            --format=zip \
            --prefix="${repo_name}-${tag}/" \
            --output="dist/${repo_name}-${tag}.zip" \
            "${tag}"
          (
            cd dist
            sha256sum "${repo_name}-${tag}.zip" > "${repo_name}-${tag}.zip.sha256"
          )

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo_name="${GITHUB_REPOSITORY#*/}"
          tag="${GITHUB_REF_NAME}"
          gh release create "${tag}" \
            "dist/${repo_name}-${tag}.zip" \
            "dist/${repo_name}-${tag}.zip.sha256" \
            --verify-tag \
            --generate-notes \
            --title "${tag}"
